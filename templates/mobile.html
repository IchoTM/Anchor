<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content">
  <title>Messages • Grandma Eleanor</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

    :root {
      --app-height: 100dvh;
      --ios-blue: #007aff;
      --ios-bubble-blue: linear-gradient(180deg, #0a84ff 0%, #007aff 100%);
      --ios-bubble-gray: #26252a;
      --ios-bubble-gray-border: rgba(255, 255, 255, 0.08);
      --ios-secondary: #8e8e93;
    }

    html, body {
      height: 100%;
      height: var(--app-height, 100dvh);
      max-height: var(--app-height, 100dvh);
      width: 100vw;
      overflow: hidden;
      background: #000000;
    }

    body {
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Plus Jakarta Sans', sans-serif;
      display: flex;
      flex-direction: column;
      position: relative;
    }

    /* iOS 17/18 iMessage Header */
    .imessage-header {
      background: rgba(26, 26, 28, 0.94);
      backdrop-filter: blur(28px);
      -webkit-backdrop-filter: blur(28px);
      border-bottom: 0.5px solid rgba(255, 255, 255, 0.16);
      padding: calc(8px + env(safe-area-inset-top)) 14px 10px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
      z-index: 100;
    }

    .header-nav-left {
      display: flex;
      align-items: center;
      gap: 4px;
      color: var(--ios-blue);
      font-size: 17px;
      font-weight: 400;
      cursor: pointer;
      min-width: 75px;
    }

    .chevron-back {
      font-size: 22px;
      line-height: 1;
      font-weight: 300;
      margin-top: -2px;
    }

    .header-center {
      display: flex;
      flex-direction: column;
      align-items: center;
      cursor: pointer;
    }

    .contact-avatar {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: linear-gradient(135deg, #c084fc, #6366f1);
      display: grid;
      place-items: center;
      font-size: 22px;
      box-shadow: 0 2px 10px rgba(99, 102, 241, 0.35);
      border: 1px solid rgba(255, 255, 255, 0.2);
    }

    .contact-name-row {
      display: flex;
      align-items: center;
      gap: 3px;
      margin-top: 3px;
    }

    .contact-name {
      font-size: 14px;
      font-weight: 600;
      color: #fff;
    }

    .contact-chevron {
      font-size: 11px;
      color: var(--ios-secondary);
    }

    .header-nav-right {
      min-width: 75px;
      display: flex;
      justify-content: flex-end;
    }

    .facetime-btn {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.08);
      display: grid;
      place-items: center;
      color: var(--ios-blue);
      border: 0.5px solid rgba(255, 255, 255, 0.1);
      cursor: pointer;
    }

    .facetime-btn svg {
      width: 17px;
      height: 17px;
      fill: currentColor;
    }

    /* Message History Stream */
    .chat-scroll {
      flex: 1 1 0%;
      min-height: 0;
      padding: 16px 14px 10px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 12px;
      -webkit-overflow-scrolling: touch;
    }

    .imessage-stamp {
      text-align: center;
      color: var(--ios-secondary);
      font-size: 11.5px;
      font-weight: 500;
      margin: 2px 0;
      letter-spacing: -0.01em;
    }

    .imessage-secure-notice {
      text-align: center;
      color: #636366;
      font-size: 10.5px;
      margin-bottom: 4px;
      line-height: 1.35;
    }

    /* Outgoing Blue iMessage Bubble */
    .bubble-row-outgoing {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 3px;
    }

    .imessage-bubble-blue {
      background: var(--ios-bubble-blue);
      color: #ffffff;
      padding: 9px 15px;
      border-radius: 19px 19px 4px 19px;
      max-width: 78%;
      font-size: 15.5px;
      line-height: 1.32;
      word-wrap: break-word;
      letter-spacing: -0.01em;
      box-shadow: 0 1px 2px rgba(0, 0, 0, 0.3);
    }

    .bubble-status {
      font-size: 11px;
      color: var(--ios-secondary);
      padding-right: 4px;
      font-weight: 400;
    }

    /* Incoming Gray iMessage Bubble (Standard native style) */
    .bubble-row-incoming {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 3px;
      max-width: 82%;
    }

    .imessage-bubble-gray {
      background: var(--ios-bubble-gray);
      border: 0.5px solid var(--ios-bubble-gray-border);
      color: #ffffff;
      padding: 9px 14px;
      border-radius: 19px 19px 19px 4px;
      font-size: 15px;
      line-height: 1.34;
      word-wrap: break-word;
      letter-spacing: -0.01em;
    }

    /* Subtle tag for alerts */
    .imessage-bubble-gray.alert-bubble {
      border-color: rgba(255, 69, 58, 0.35);
      background: #2a1f21;
    }

    /* Keyboard Accessory Scenario Chips */
    .scenarios-tray {
      max-height: 0;
      opacity: 0;
      overflow: hidden;
      display: flex;
      gap: 7px;
      overflow-x: auto;
      white-space: nowrap;
      background: #111113;
      border-top: 0.5px solid transparent;
      padding: 0 12px;
      transition: max-height 0.22s ease, opacity 0.2s ease, padding 0.2s ease;
      flex-shrink: 0;
      pointer-events: none;
      -webkit-overflow-scrolling: touch;
    }

    .scenarios-tray.open {
      max-height: 48px;
      opacity: 1;
      padding: 7px 12px 5px;
      border-top-color: rgba(255, 255, 255, 0.08);
      pointer-events: auto;
    }

    .scenarios-tray::-webkit-scrollbar { display: none; }

    .preset-pill {
      background: rgba(255, 255, 255, 0.08);
      color: #e5e5ea;
      border: 0.5px solid rgba(255, 255, 255, 0.14);
      border-radius: 999px;
      padding: 5px 11px;
      font-size: 12px;
      font-weight: 500;
      white-space: nowrap;
      cursor: pointer;
    }

    .preset-pill:active {
      background: rgba(255, 255, 255, 0.18);
    }

    /* Bottom iOS iMessage Composer */
    .composer-wrapper {
      background: rgba(26, 26, 28, 0.96);
      backdrop-filter: blur(28px);
      -webkit-backdrop-filter: blur(28px);
      border-top: 0.5px solid rgba(255, 255, 255, 0.15);
      flex-shrink: 0;
      z-index: 100;
    }

    .composer {
      padding: 7px 10px calc(7px + env(safe-area-inset-bottom, 8px));
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .btn-apps-plus {
      width: 33px;
      height: 33px;
      border-radius: 50%;
      background: #2c2c2e;
      border: 0.5px solid rgba(255, 255, 255, 0.15);
      color: #ffffff;
      display: grid;
      place-items: center;
      font-size: 19px;
      font-weight: 300;
      cursor: pointer;
      flex-shrink: 0;
    }

    .input-capsule {
      flex: 1;
      min-height: 36px;
      background: #1c1c1e;
      border: 0.5px solid #38383a;
      border-radius: 20px;
      padding: 0 6px 0 13px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .input-box {
      flex: 1;
      background: transparent;
      border: none;
      font-size: 15.5px;
      color: #fff;
      outline: none;
      padding: 8px 0;
      font-family: inherit;
    }

    .input-box::placeholder {
      color: #8e8e93;
    }

    .btn-send-arrow {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: var(--ios-blue);
      color: white;
      border: none;
      display: grid;
      place-items: center;
      cursor: pointer;
      transition: background 0.15s, transform 0.1s;
      flex-shrink: 0;
    }

    .btn-send-arrow:active {
      transform: scale(0.92);
    }

    .btn-send-arrow:disabled {
      background: #3a3a3c;
      color: #8e8e93;
      cursor: default;
    }

    .btn-send-arrow svg {
      width: 14px;
      height: 14px;
      fill: none;
      stroke: currentColor;
      stroke-width: 2.4;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    /* Identity Modal Popup */
    .identity-modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.78);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      z-index: 1000;
      place-items: center;
      padding: 20px;
    }

    .identity-card {
      background: #1c1c1e;
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 22px;
      padding: 22px;
      max-width: 350px;
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 15px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.7);
      animation: popIn 0.2s ease-out;
    }

    @keyframes popIn {
      from { transform: scale(0.92); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }

    .modal-header-icon {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: linear-gradient(135deg, #0284c7, #38bdf8);
      display: grid;
      place-items: center;
      font-size: 22px;
      margin: 0 auto;
    }

    .modal-title {
      font-size: 17px;
      font-weight: 700;
      text-align: center;
    }

    .modal-desc {
      font-size: 12px;
      color: #8e8e93;
      text-align: center;
      line-height: 1.4;
      margin-top: -6px;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 5px;
      text-align: left;
    }

    .form-group label {
      font-size: 11px;
      font-weight: 600;
      color: #8e8e93;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .modal-input {
      background: #2c2c2e;
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 12px;
      padding: 10px 13px;
      font-size: 15px;
      color: #fff;
      font-family: inherit;
      outline: none;
    }

    .modal-input:focus {
      border-color: var(--ios-blue);
    }

    .quick-presets-label {
      font-size: 11px;
      color: #8e8e93;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .quick-presets-row {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .quick-chip {
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 8px;
      padding: 5px 9px;
      font-size: 11px;
      color: #d1d5db;
      cursor: pointer;
    }

    .btn-save-identity {
      background: var(--ios-blue);
      color: white;
      border: none;
      border-radius: 13px;
      padding: 11px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      margin-top: 4px;
    }

    .btn-save-identity:active {
      background: #0056b3;
    }
  </style>
</head>
<body>

  <!-- iMessage Top Bar -->
  <header class="imessage-header">
    <div class="header-nav-left" onclick="openIdentityModal()">
      <span class="chevron-back">‹</span>
      <span>Messages</span>
    </div>

    <div class="header-center" onclick="openIdentityModal()">
      <div class="contact-avatar">👵</div>
      <div class="contact-name-row">
        <span class="contact-name" id="contactHeaderName">Grandma Eleanor</span>
        <span class="contact-chevron">›</span>
      </div>
    </div>

    <div class="header-nav-right">
      <div class="facetime-btn" title="FaceTime" onclick="openIdentityModal()">
        <svg viewBox="0 0 24 24"><path d="M17 10.5V7a1 1 0 0 0-1-1H4a1 1 0 0 0-1 1v10a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-3.5l4 4v-11l-4 4z"/></svg>
      </div>
    </div>
  </header>

  <!-- Messages History Stream -->
  <div class="chat-scroll" id="chatStream"></div>

  <!-- Scenario Quick Pills -->
  <div class="scenarios-tray" id="scenariosTray">
    <button type="button" class="preset-pill" onmousedown="event.preventDefault()" onclick="fillScenario('I will be there in 10 mins!')">⏳ 10 Mins</button>
    <button type="button" class="preset-pill" onmousedown="event.preventDefault()" onclick="fillScenario('Did you take your morning pills? Call me.')">💊 Pill Check</button>
    <button type="button" class="preset-pill" onmousedown="event.preventDefault()" onclick="fillScenario('I left your reading glasses on the nightstand.')">👓 Lost Item</button>
    <button type="button" class="preset-pill" style="color: #fb7185; border-color: rgba(244, 63, 94, 0.4);" onmousedown="event.preventDefault()" onclick="fillScenario('Grandma, I got arrested in Mexico and need $2,000 bail money right now. Wire it immediately and do not tell mom!')">🚨 Bail Scam</button>
  </div>

  <!-- iOS Composer Bar -->
  <div class="composer-wrapper">
    <div class="composer">
      <button type="button" class="btn-apps-plus" onclick="openIdentityModal()" title="Switch Sender">+</button>
      <div class="input-capsule">
        <input type="text" id="messageInput" class="input-box" placeholder="iMessage" enterkeyhint="send" autocomplete="off" autocorrect="on" onkeydown="if(event.key==='Enter') sendMessage()" oninput="toggleSendBtnState()">
        <button type="button" class="btn-send-arrow" id="sendArrowBtn" onclick="sendMessage()" disabled>
          <svg viewBox="0 0 24 24"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
        </button>
      </div>
    </div>
  </div>

  <!-- Personal Identity Popup Modal -->
  <div class="identity-modal" id="identityModal">
    <div class="identity-card">
      <div class="modal-header-icon">⚓</div>
      <div class="modal-title">Who is texting Eleanor?</div>
      <div class="modal-desc">
        Select your contact info and relation to Eleanor. All family &amp; caregivers receive live security alerts if an outside scam is intercepted.
      </div>

      <div class="form-group">
        <label for="contactInfoInput">Contact Info</label>
        <input type="text" id="contactInfoInput" class="modal-input" placeholder="e.g. Alex, Sarah, or +1 (555) 019-2834" value="Alex">
      </div>

      <div class="form-group">
        <label for="relationInput">Relation</label>
        <input type="text" id="relationInput" class="modal-input" placeholder="e.g. Grandson, Daughter, Caregiver, Unknown Sender" value="Grandson">
      </div>

      <div class="quick-presets-label">Quick Contacts:</div>
      <div class="quick-presets-row">
        <button type="button" class="quick-chip" onclick="fillProfile('Alex', 'Grandson')">Alex (Grandson)</button>
        <button type="button" class="quick-chip" onclick="fillProfile('Sarah', 'Daughter')">Sarah (Daughter)</button>
        <button type="button" class="quick-chip" onclick="fillProfile('David', 'Son')">David (Son)</button>
        <button type="button" class="quick-chip" onclick="fillProfile('Maria', 'Caregiver')">Maria (Caregiver)</button>
        <button type="button" class="quick-chip" onclick="fillProfile('Dr. Chen', 'Doctor')">Dr. Chen (Doctor)</button>
        <button type="button" class="quick-chip" style="color: #fb7185; border-color: rgba(244, 63, 94, 0.3);" onclick="fillProfile('+1 (555) 019-2834', 'Unknown Sender')">⚠️ Unknown Sender</button>
      </div>

      <button type="button" class="btn-save-identity" onclick="saveIdentity()">Done</button>
    </div>
  </div>

  <script>
    let currentSender = localStorage.getItem('anchor_sender_name') || "Alex";
    let currentRelationship = localStorage.getItem('anchor_sender_rel') || "Grandson";
    let lastHandledAlertId = null;

    function isFamilyOrCaregiver() {
      const rel = (currentRelationship || "").toLowerCase();
      const sender = (currentSender || "").toLowerCase();
      return !rel.includes('unknown') && !sender.includes('unknown');
    }

    function resetChatStreamForCurrentPersona() {
      const chatStream = document.getElementById('chatStream');
      if (!chatStream) return;

      chatStream.innerHTML = `
        <div class="imessage-stamp">Today 10:42 AM</div>
        <div class="imessage-secure-notice">
          ${isFamilyOrCaregiver() 
            ? 'iMessage • Anchor Care Assistant Active' 
            : 'iMessage with Eleanor'}
        </div>
      `;
      chatStream.scrollTop = chatStream.scrollHeight;
    }

    function syncViewport() {
      if (window.visualViewport) {
        const vh = window.visualViewport.height;
        document.documentElement.style.setProperty('--app-height', `${vh}px`);

        const isKeyboardOpen = window.visualViewport.height < (window.innerHeight - 80);
        const composer = document.querySelector('.composer');
        if (composer) {
          composer.style.paddingBottom = isKeyboardOpen ? '7px' : 'calc(7px + env(safe-area-inset-bottom, 8px))';
        }

        const chatStream = document.getElementById('chatStream');
        if (chatStream) {
          chatStream.scrollTop = chatStream.scrollHeight;
        }
      }
    }

    if (window.visualViewport) {
      window.visualViewport.addEventListener('resize', syncViewport);
      window.visualViewport.addEventListener('scroll', () => window.scrollTo(0, 0));
    }
    window.addEventListener('resize', syncViewport);
    syncViewport();

    const messageInput = document.getElementById('messageInput');
    const scenariosTray = document.getElementById('scenariosTray');

    messageInput.addEventListener('focus', () => {
      if (scenariosTray) scenariosTray.classList.add('open');
      setTimeout(() => {
        syncViewport();
        const chatStream = document.getElementById('chatStream');
        if (chatStream) chatStream.scrollTop = chatStream.scrollHeight;
      }, 180);
    });

    messageInput.addEventListener('blur', () => {
      setTimeout(() => {
        if (document.activeElement !== messageInput && scenariosTray) {
          scenariosTray.classList.remove('open');
          syncViewport();
        }
      }, 150);
    });

    function toggleSendBtnState() {
      const input = document.getElementById('messageInput');
      const sendBtn = document.getElementById('sendArrowBtn');
      sendBtn.disabled = !input.value.trim();
    }

    function openIdentityModal() {
      document.getElementById('contactInfoInput').value = currentSender;
      document.getElementById('relationInput').value = currentRelationship;
      document.getElementById('identityModal').style.display = 'grid';
    }

    function closeIdentityModal() {
      document.getElementById('identityModal').style.display = 'none';
    }

    function fillProfile(contact, rel) {
      document.getElementById('contactInfoInput').value = contact;
      document.getElementById('relationInput').value = rel;
    }

    function saveIdentity() {
      const contact = document.getElementById('contactInfoInput').value.trim();
      const rel = document.getElementById('relationInput').value.trim();

      const changed = (contact && contact !== currentSender) || (rel && rel !== currentRelationship);

      if (contact) currentSender = contact;
      if (rel) currentRelationship = rel;

      localStorage.setItem('anchor_sender_name', currentSender);
      localStorage.setItem('anchor_sender_rel', currentRelationship);

      closeIdentityModal();

      if (changed) {
        lastHandledAlertId = null;
        resetChatStreamForCurrentPersona();
      }
    }

    window.addEventListener('DOMContentLoaded', () => {
      resetChatStreamForCurrentPersona();
      openIdentityModal();
    });

    function fillScenario(text) {
      const input = document.getElementById('messageInput');
      input.value = text;
      toggleSendBtnState();
      input.focus();
    }

    // Normal incoming message bubble for security alerts
    function renderMaliciousWarningBubble(data) {
      const chatStream = document.getElementById('chatStream');
      const senderInfo = data.sender_handle || data.sender_name || "Unknown Sender";
      const reason = data.malicious_reason || "Emergency extortion / Grandparent scam pattern";

      const alertRow = document.createElement('div');
      alertRow.className = 'bubble-row-incoming';
      alertRow.innerHTML = `
        <div class="imessage-bubble-gray alert-bubble">
          <strong>⚠️ [Anchor Security Alert]</strong><br>
          Blocked suspicious text to Eleanor from <em>${escapeHtml(senderInfo)}</em>:<br>
          "${escapeHtml(data.raw_message)}"<br><br>
          <span style="color:#ff8e8e;font-size:13px;">Reason: ${escapeHtml(reason)}</span><br>
          <span style="color:#8e8e93;font-size:12px;">✓ Shielded from Eleanor's screen</span>
        </div>
      `;
      chatStream.appendChild(alertRow);
      chatStream.scrollTop = chatStream.scrollHeight;
    }

    async function sendMessage() {
      const input = document.getElementById('messageInput');
      const text = input.value.trim();
      if (!text) return;

      const chatStream = document.getElementById('chatStream');
      const sendBtn = document.getElementById('sendArrowBtn');

      // 1. Sent Blue iMessage Bubble
      const outgoingRow = document.createElement('div');
      outgoingRow.className = 'bubble-row-outgoing';
      outgoingRow.innerHTML = `
        <div class="imessage-bubble-blue">${escapeHtml(text)}</div>
        <div class="bubble-status">Delivered</div>
      `;
      chatStream.appendChild(outgoingRow);
      chatStream.scrollTop = chatStream.scrollHeight;

      input.value = '';
      sendBtn.disabled = true;

      try {
        const [res, telemetryRes] = await Promise.all([
          fetch('/webhook/imessage', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              sender_name: currentSender,
              relationship: currentRelationship,
              raw_message: text
            })
          }),
          fetch('/telemetry/presage').catch(() => null)
        ]);

        const data = await res.json();
        let telemetryData = null;
        if (telemetryRes && telemetryRes.ok) {
          try {
            telemetryData = await telemetryRes.json();
          } catch (e) {}
        }

        const statusEl = outgoingRow.querySelector('.bubble-status');

        // MALICIOUS INTERCEPTION ROUTING
        if (data.is_malicious || data.blocked_from_patient) {
          statusEl.textContent = 'Delivered';

          if (data.event_id) {
            lastHandledAlertId = data.event_id;
          }

          if (isFamilyOrCaregiver()) {
            renderMaliciousWarningBubble(data);
          }
          return;
        }

        // SAFE GROUNDED INTERACTION
        const isPanic = Boolean(data.anxiety_detected);
        const anxietyScore = data.anxiety_score || 0;

        let bpm = 74;
        if (telemetryData && telemetryData.biometrics) {
          bpm = Math.round(telemetryData.biometrics.heart_rate || (isPanic ? 96 : 74));
        } else {
          bpm = Math.round(72 + (anxietyScore * 32));
        }

        statusEl.textContent = data.audio_generated 
          ? `Delivered • Spoken aloud (${bpm} BPM)` 
          : `Delivered quietly to bedside screen`;

        if (!isFamilyOrCaregiver()) {
          return;
        }

        // 2. Incoming Gray iMessage confirmation bubble from Anchor
        const incomingRow = document.createElement('div');
        incomingRow.className = 'bubble-row-incoming';

        const modeNote = data.audio_generated 
          ? `Spoken aloud to calm agitation (${bpm} BPM)` 
          : `Displayed on screen (Vitals stable, ${bpm} BPM)`;

        incomingRow.innerHTML = `
          <div class="imessage-bubble-gray">
            Hi ${escapeHtml(currentSender)}, Eleanor received your message.<br><br>
            <em>Anchor grounded it as:</em><br>
            "${escapeHtml(data.grounded_message)}"<br><br>
            <span style="color:#8e8e93;font-size:12px;">${modeNote}</span>
          </div>
        `;
        chatStream.appendChild(incomingRow);
        chatStream.scrollTop = chatStream.scrollHeight;

      } catch (err) {
        const statusEl = outgoingRow.querySelector('.bubble-status');
        statusEl.textContent = 'Failed to deliver';
        statusEl.style.color = '#ff453a';
      } finally {
        toggleSendBtnState();
      }
    }

    // Live Security Alert Poller for Family and Caregivers
    setInterval(async () => {
      if (!isFamilyOrCaregiver()) return;

      try {
        const res = await fetch('/api/caregiver/alerts/latest');
        const data = await res.json();
        if (data.alert && data.alert.event_id && data.alert.event_id !== lastHandledAlertId) {
          lastHandledAlertId = data.alert.event_id;
          renderMaliciousWarningBubble(data.alert);
        }
      } catch (e) {}
    }, 2000);

    function escapeHtml(string) {
      const div = document.createElement('div');
      div.textContent = string;
      return div.innerHTML;
    }
  </script>
</body>
</html>
